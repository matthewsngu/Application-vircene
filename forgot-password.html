<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Vircène</title>
  <meta name="description" content="Réinitialise ton mot de passe Vircène.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-page">
    <article class="card auth-card">
      <a href="index.html" class="logo">Vircène</a>
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">On t'envoie un lien de réinitialisation par email.</p>

      <p class="auth-error" id="forgotError" role="alert" hidden></p>
      <p class="auth-success" id="forgotSuccess" hidden></p>

      <form id="forgotForm" action="#" method="post">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="toi@exemple.fr">
        </div>
        <button type="submit" class="btn btn--primary">Envoyer le lien</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Retour à la connexion</a>
      </p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('forgotError');
      const ok = document.getElementById('forgotSuccess');
      err.hidden = true;
      ok.hidden = true;

      try {
        await VirceneAuth.resetPassword(document.getElementById('email').value);
        ok.textContent = 'Email envoyé. Vérifie ta boîte mail (et les spams).';
        ok.hidden = false;
        e.target.reset();
      } catch (error) {
        err.textContent = VirceneAuth.formatAuthError(error);
        err.hidden = false;
      }
    });
  </script>
</body>
</html>
