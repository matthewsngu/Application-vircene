<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — Vircène</title>
  <meta name="description" content="Crée ton compte Vircène — Premium 4,99 €/mois.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <main class="auth-page">
    <article class="card auth-card">
      <a href="index.html" class="logo">Vircène</a>
      <h1>Commence ta routine</h1>
      <p class="subtitle">Accès complet — 4,99 €/mois, annulable à tout moment.</p>

      <p class="auth-error" id="registerError" role="alert" hidden></p>

      <form id="registerForm" action="#" method="post">
        <div class="form-field">
          <label for="name">Prénom</label>
          <input type="text" id="name" name="firstName" autocomplete="given-name" required placeholder="Marie">
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="toi@exemple.fr">
        </div>
        <div class="form-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="8 caractères minimum">
        </div>
        <div class="form-field form-field--checkbox">
          <label class="checkbox-label">
            <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
            J'accepte les <a href="cgu.html" target="_blank" rel="noopener">CGU</a> et la <a href="confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>
          </label>
        </div>
        <button type="submit" class="btn btn--primary">Créer mon compte</button>
      </form>

      <p class="auth-divider">ou</p>
      <button type="button" class="btn btn--google" data-auth-provider="google">
        Continuer avec Google
      </button>

      <p class="auth-footer">
        Déjà inscrit ? <a href="login.html">Se connecter</a>
      </p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/paywall.js"></script>
  <script src="js/stripe.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function () {
      const err = document.getElementById('registerError');
      const params = new URLSearchParams(window.location.search);
      const planParam = params.get('plan');
      if (planParam) sessionStorage.setItem('vircene_checkout_plan', planParam);

      try {
        const existing = await VirceneAuth.resolveAuthOnLoad();
        if (existing && !VirceneAuth.hasOAuthReturn()) {
          VirceneAuth.redirectAfterAuth(existing);
          return;
        }
      } catch (error) {
        err.textContent = VirceneAuth.formatAuthError(error);
        err.hidden = false;
      }

      VirceneAuth.bindSocialAuth({ errorEl: 'registerError', isRegister: true });

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        const password = document.getElementById('password').value;
        if (password.length < 8) {
          err.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
          err.hidden = false;
          return;
        }
        if (!document.getElementById('acceptTerms').checked) {
          err.textContent = 'Accepte les CGU et la politique de confidentialité pour continuer.';
          err.hidden = false;
          return;
        }
        try {
          const session = await VirceneAuth.register(new FormData(e.target));
          VirceneAuth.redirectAfterAuth(session);
        } catch (error) {
          err.textContent = VirceneAuth.formatAuthError(error);
          err.hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
