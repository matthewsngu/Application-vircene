<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diagnostic — Vircène</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/diagnostic.css?v=105">
<link rel="stylesheet" href="css/account-badge.css?v=1">
</head>
<body class="diag-flow">

<a href="app.html" class="diag-back-link" id="diagBackLink">← Retour à l'app</a>
<div id="diagRoot"></div>

<script src="js/config.js"></script>
<script src="js/paywall.js"></script>
<script src="js/auth.js"></script>
<script src="js/diagnostic-engine.js"></script>
<script src="js/diagnostic.js"></script>
<script src="js/account-badge.js"></script>
<script>
  (async function () {
    let session = VirceneAuth.readSession();
    if (!session) {
      try {
        session = await VirceneAuth.resolveAuthOnLoad();
      } catch {
        session = null;
      }
    }
    if (!session) {
      window.location.replace('login.html?next=diagnostic.html');
      return;
    }

    session = VirceneAuth.requirePremiumOrRedirect(session);
    if (!session) return;

    const params = new URLSearchParams(window.location.search);
    const isUpdate = params.get('update') === '1';

    if (!isUpdate && VirceneAuth.hasDiagnostic(session.id)) {
      window.location.replace('analyse-cutanee');
      return;
    }

    const backLink = document.getElementById('diagBackLink');
    if (backLink) {
      backLink.href = isUpdate ? 'analyse-cutanee' : 'app.html?view=accueil';
      backLink.textContent = isUpdate ? '← Analyse cutanée' : '← Accueil';
    }

    if (isUpdate) {
      document.title = 'Mettre à jour — Vircène';
    }

    VirceneDiagnostic.boot({
      userId: session.id,
      skipIntro: isUpdate,
      restoreFromSaved: isUpdate,
      returnUrl: 'analyse-cutanee',
      onComplete: async function () {
        if (isUpdate) {
          window.location.replace('analyse-cutanee');
          return;
        }
        await VirceneAuth.markOnboardingDone();
        VirceneAuth.markEntrance();
        window.location.replace('app.html?view=accueil');
      }
    });
  })();
</script>
</body>
</html>
